# Render blueprint for the LingoBridge translation gateway (apps/gateway).
#
# The gateway holds every provider credential. The extension never calls MyMemory,
# NVIDIA or OpenRouter directly, so nothing here may ever be copied into the
# extension package or committed to this repository.
#
# Why Render and not a serverless host: the gateway keeps a long-lived process.
# LINGOBRIDGE_EXPLANATION_TIMEOUT_MS allows 90s for an explanation, which exceeds
# common serverless limits, and the rate limiter in src/rate-limiter.ts is an
# in-memory Map. A second instance would silently double every configured limit,
# so this service must stay single-instance.
#
# Every variable apps/gateway/src/config.ts reads is listed below, so the deployed
# configuration is explicit rather than relying on defaults. The three credentials
# use `sync: false`: Render prompts for them and stores the values itself, and they
# never appear in this file or in git.

services:
  - type: web
    name: lingobridge-gateway
    runtime: node
    plan: free
    region: oregon
    branch: main

    # Install only the gateway and its one workspace dependency, @lingobridge/contracts.
    # Do NOT use `pnpm build:packages` here: that also builds database and auth, which
    # this filtered install deliberately leaves out, so it would fail on a missing tsc.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --filter=@lingobridge/gateway... &&
      pnpm --filter @lingobridge/contracts build &&
      pnpm --filter @lingobridge/gateway build

    # Run node directly rather than `pnpm --filter @lingobridge/gateway start`.
    # Going through pnpm made corepack download pnpm on every boot, costing about
    # 14 seconds before node even started — paid on every cold start, which a free
    # instance pays often. It also meant Render's SIGTERM hit pnpm instead of node,
    # so ordinary shutdowns logged ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL.
    #
    # Node resolves @lingobridge/contracts through the symlink pnpm wrote into
    # apps/gateway/node_modules at install time, so no package manager is needed.
    startCommand: node apps/gateway/dist/index.js

    # Deliberately "/" and not "/v1/health".
    #
    # In live mode `requireOrigin` is true (config.ts), and the origin middleware in
    # app.ts covers every "/v1/*" path. Render's health check is a server-to-server
    # GET with no Origin header and no installation header, so /v1/health answers
    # 403 and the service never passes its check.
    #
    # "/" is registered outside that middleware and returns a provider-independent
    # status object, so it never burns provider quota either.
    healthCheckPath: /

    envVars:
      # ---------------------------------------------------------------------
      # Runtime
      # ---------------------------------------------------------------------
      - key: NODE_VERSION
        value: "22"

      # Required. src/config.ts defaults HOST to 127.0.0.1, which on Render would
      # bind to loopback only and make the service unreachable from outside.
      # PORT is intentionally absent — Render injects it and the app reads it.
      - key: HOST
        value: 0.0.0.0

      - key: LINGOBRIDGE_TRANSLATION_MODE
        value: live

      # Exact chrome-extension:// origins, comma separated. Live mode refuses to
      # start with none, and wildcards are rejected.
      #
      # Allow the Chrome Web Store package and the repository's unpacked development build.
      # The dashboard's LINGOBRIDGE_ALLOWED_EXTENSION_IDS must list the same ids without
      # the chrome-extension:// prefix.
      - key: LINGOBRIDGE_ALLOWED_EXTENSION_ORIGINS
        value: chrome-extension://ioekknfcfhcohnjfhiodgielimgeobdf,chrome-extension://kbnchdmopaamlbpgihdbjjnohinmapje

      # ---------------------------------------------------------------------
      # Credentials. Values are entered in Render, never here.
      # ---------------------------------------------------------------------

      # Live mode throws without these two.
      #
      # MYMEMORY_CONTACT_EMAIL is sent to MyMemory as the `de` parameter on every
      # request and must be named in the public privacy policy, so it becomes
      # public. Prefer a dedicated address over a personal one.
      - key: MYMEMORY_CONTACT_EMAIL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false

      # MyMemory meters its free tier per IP address, and this instance shares one
      # egress address with every other free service on the host. Neighbouring
      # traffic can spend the day's characters before a single request of ours
      # arrives, which surfaces as "the translation provider is temporarily
      # unavailable" for any language NVIDIA cannot cover — Nepali above all.
      #
      # A RapidAPI subscription key moves the quota onto the subscribing account.
      # It is the same MyMemory API and the same `de` contact email, so the online
      # consent disclosure in docs/06-ai-and-translation.md is unchanged. Leaving
      # it empty falls back to the public endpoint and the shared meter.
      - key: MYMEMORY_RAPIDAPI_KEY
        sync: false

      # MyMemory's own private Translation Memory key, sent as `key`. Their spec
      # calls it "customized API limits", but whether it lifts the per-IP daily
      # quota is undocumented and could not be measured without exhausting that
      # quota on purpose. Sent when set because it cannot hurt; the provider
      # logging below is what will actually show whether it helps.
      - key: MYMEMORY_PRIVATE_KEY
        sync: false

      # Optional backup for Explain and word understanding when NVIDIA fails or is
      # slow. An empty value cleanly disables it; translation is unaffected either
      # way, since that path is MyMemory then NVIDIA.
      - key: OPENROUTER_API_KEY
        sync: false

      # ---------------------------------------------------------------------
      # Providers
      # ---------------------------------------------------------------------
      - key: MYMEMORY_BASE_URL
        value: https://api.mymemory.translated.net

      # Used only when MYMEMORY_RAPIDAPI_KEY is set. Copy it from the RapidAPI
      # console's code snippet (the X-RapidAPI-Host header) if the listing moves.
      - key: MYMEMORY_RAPIDAPI_HOST
        value: mymemory-translation-memory1.p.rapidapi.com

      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/riva-translate-4b-instruct-v2
      - key: NVIDIA_MAX_TOKENS
        value: "2048"

      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: nex-agi/nex-n2.5-pro:free

      # GOOGLE_CLOUD_PROJECT is deliberately unset: the Google provider stays off
      # until GCP credentials are wired up. It is an identifier, not a credential,
      # and setting it would also require Application Default Credentials from the
      # deployment environment.

      # ---------------------------------------------------------------------
      # Explanation chain
      # ---------------------------------------------------------------------
      - key: NVIDIA_EXPLANATION_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_EXPLANATION_MAX_TOKENS
        value: "4096"

      # Total budget for an explanation, and how long NVIDIA may take before the
      # OpenRouter backup is asked instead.
      - key: LINGOBRIDGE_EXPLANATION_TIMEOUT_MS
        value: "90000"
      - key: LINGOBRIDGE_EXPLANATION_PRIMARY_TIMEOUT_MS
        value: "20000"

      # ---------------------------------------------------------------------
      # Limits and timeouts
      # ---------------------------------------------------------------------
      # MyMemory throttles as an address approaches its quota rather than failing
      # outright: measured 0.4s when fresh and 10-15s when throttled. At 10000 a
      # throttled-but-working provider was reported as an outage, so this sits
      # above the observed ceiling. The popup shows a spinner for the difference.
      - key: LINGOBRIDGE_PROVIDER_TIMEOUT_MS
        value: "18000"
      - key: LINGOBRIDGE_RATE_WINDOW_MS
        value: "60000"
      - key: LINGOBRIDGE_INSTALLATION_RATE_LIMIT
        value: "20"
      - key: LINGOBRIDGE_NETWORK_RATE_LIMIT
        value: "30"

      # ---------------------------------------------------------------------
      # Capability catalogue cache
      #
      # The free plan has no persistent disk, so this file is lost on every restart
      # and the catalogue is re-fetched. That is a cold-start cost, not a failure —
      # the store already retries.
      # ---------------------------------------------------------------------
      - key: LINGOBRIDGE_CAPABILITY_CACHE_PATH
        value: .data/online-provider-capabilities.json
      - key: LINGOBRIDGE_CAPABILITY_FRESH_MS
        value: "86400000"
      - key: LINGOBRIDGE_CAPABILITY_RETRY_MS
        value: "300000"

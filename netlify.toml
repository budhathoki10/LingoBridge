# Netlify build for the LingoBridge dashboard (apps/dashboard).
# The build runs from the workspace root so pnpm can resolve the `workspace:*`
# dependencies on @lingobridge/contracts, @lingobridge/database, and @lingobridge/auth.
# Those three must be compiled before `next build`, which is what `build:packages` does.

[build]
  command = "pnpm build:packages && pnpm --filter @lingobridge/dashboard build"
  publish = "apps/dashboard/.next"

[build.environment]
  # package.json requires Node >= 22.
  NODE_VERSION = "22"

  # Install only the dashboard and the workspaces it depends on:
  # contracts, database, auth, design-tokens. This skips apps/extension, whose
  # `prepare` hook runs `wxt prepare` and resolves @lingobridge/contracts at
  # install time — before `build:packages` has produced its dist/, so it fails
  # on a clean clone. The extension is not part of this deploy anyway, and
  # skipping it makes the install smaller.
  #
  # Do NOT add NODE_ENV=production here: pnpm would skip devDependencies, and
  # `build:packages` needs typescript. Next.js sets it in its own server.
  PNPM_FLAGS = "--filter=@lingobridge/dashboard..."

[[plugins]]
  package = "@netlify/plugin-nextjs"
